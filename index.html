<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PUCIBO 经营作战台</title>
<meta name="description" content="济南万象城 L1 PUCIBO 经营作战台。数字来自 data.json，没有真实数据的格子写待接入。">
<meta name="theme-color" content="#1C0A10">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PUCIBO作战台">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:wght@600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#5A1A20;--dusk:#1C0A10;--cream:#F6ECD2;--gold:#E6C98A;--tomato:#D8402F;--basil:#3E7D3A;
  --ink:#1C0A10;--bg:#F6ECD2;--card:#FFF9F0;--line:rgba(90,26,32,.16);--muted:#5C4036;--soft:#F3E6CC;
  --sans:"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --display:"ZCOOL XiaoWei","Songti SC","STSong","Noto Serif SC","Source Han Serif SC",var(--sans);
  --latin:"Cinzel","Times New Roman",serif;
  --num:"Cormorant Garamond","Cinzel",var(--sans);
  --r:18px;
  --sh:0 1px 0 rgba(28,10,16,.04),0 12px 28px rgba(28,10,16,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--wine)}
img{max-width:100%}
.num{font-family:var(--num);font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"tnum"}
.top{position:sticky;top:0;z-index:30;background:var(--dusk);color:var(--cream);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid rgba(230,201,138,.35)}
.top-row{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;flex:none;min-width:0}
.brand img{width:36px;height:36px;display:block;border-radius:8px}
.brand .word{font-family:var(--latin);font-weight:700;font-size:18px;letter-spacing:.12em;line-height:1}
.brand .subname{display:block;font-family:var(--display);font-size:14px;letter-spacing:.12em;color:var(--gold);margin-top:2px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0;padding:2px 0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--cream);padding:8px 12px;border-radius:999px;font-size:15px;font-weight:650;white-space:nowrap}
.tab.on{background:var(--gold);color:var(--dusk)}
.right{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}
.clock{text-align:right;line-height:1.15}
.clock .t{font-family:var(--num);font-size:22px;font-weight:700}
.clock .t small{font-family:var(--sans);font-size:12px;color:var(--gold);font-weight:500;margin-left:4px}
.clock .s{font-size:12px;color:rgba(246,236,210,.78)}
.icon-btn{border:1px solid rgba(246,236,210,.4);background:transparent;color:var(--cream);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:650}
.icon-btn.dark{background:var(--gold);color:var(--dusk);border-color:var(--gold)}
.err{background:#F8D9D4;color:#6E1C14;padding:12px 16px;font-size:15px;display:none}
.hint{font-size:14px;color:var(--dusk);background:#F3E2B0;border-bottom:1px solid rgba(90,26,32,.15);padding:10px 16px;display:none}
.sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 16px 0;max-width:920px;margin:0 auto}
.sub .ttl{font-family:var(--display);font-size:28px;line-height:1.2;letter-spacing:.04em}
.pill{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--dusk);color:var(--gold);white-space:nowrap}
.upd{font-size:13px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.45}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:999px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--wine);color:var(--cream)}
.ticker{order:9;flex:1 1 100%;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:15px;line-height:1.55;padding:10px 14px;color:var(--dusk)}
.ticker span{display:inline}
main{padding:14px 16px 36px;max-width:920px;margin:0 auto}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;min-width:0}
.card.flat{box-shadow:none}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}
.ch h3{margin:0;font-family:var(--display);font-size:22px;font-weight:400;letter-spacing:.03em;line-height:1.25;display:flex;align-items:flex-start;gap:8px}
.ic{flex:none;min-width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--dusk);color:var(--gold);font-family:var(--latin);font-size:12px;letter-spacing:.04em;margin-top:2px}
.tag{font-size:13px;color:var(--muted);background:var(--soft);border-radius:999px;padding:4px 8px;max-width:46%;text-align:right}
.mast{padding:4px 2px 2px}
.mast .en{font-family:var(--latin);letter-spacing:.32em;font-size:12px;color:var(--wine)}
.mast .brandname{font-family:var(--latin);font-weight:700;font-size:44px;letter-spacing:.14em;line-height:.95;margin:8px 0 6px}
.mast .slogan{font-family:var(--display);font-size:26px;letter-spacing:.08em}
.mast .where{margin-top:6px;font-size:16px;color:var(--muted)}
.callout{background:var(--dusk);color:var(--cream);border-radius:var(--r);padding:16px 16px 14px;font-size:16px;line-height:1.65}
.callout b{color:var(--gold);font-weight:650}
.note{font-size:15px;color:var(--muted);line-height:1.6}
.miss{color:var(--tomato);font-weight:750}
.nc{color:#7A4E32;font-weight:700}
.plan{display:inline-block;background:#F3E2B0;color:var(--wine);border-radius:8px;padding:2px 8px;font-weight:750}
.p3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--soft);border-radius:14px;padding:10px 10px 12px;min-width:0}
.tile.on{background:#F8D9D4;outline:2px solid var(--wine)}
.tile .l{font-size:13px;color:var(--muted);font-weight:650}
.tile .v{font-size:20px;font-weight:750;margin-top:4px;line-height:1.25;word-break:break-word}
.tile.on .v{font-size:22px}
.kv{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:16px}
.kv .l{color:var(--muted);flex:none}
.kv .v{text-align:right;min-width:0;word-break:break-word}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
.bar-l{font-size:15px}
.bar-v{font-family:var(--num);font-size:28px;font-weight:700;line-height:1}
.bar-row.em .bar-l,.bar-row.em .bar-v{color:var(--wine)}
.hbar{grid-column:1 / -1;height:10px;background:rgba(90,26,32,.1);border-radius:999px;overflow:hidden}
.hbar i{display:block;height:100%;width:0;border-radius:999px;background:rgba(90,26,32,.35)}
.bar-row.em .hbar i{background:var(--wine)}
.go .hbar i{width:var(--w);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.funnel{display:flex;flex-direction:column;gap:8px}
.step{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--soft);border-radius:12px;padding:12px 12px}
.step b{font-size:17px}
.step .arrow{color:var(--gold);font-family:var(--latin);margin-right:8px}
.quote{margin:0 0 12px;padding:0 0 0 12px;border-left:3px solid var(--gold)}
.quote p{margin:0 0 6px;font-size:16px}
.quote cite{font-style:normal;font-size:13px;color:var(--muted)}
.todo{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.box{flex:none;width:22px;height:22px;border:2px solid var(--wine);border-radius:6px;margin-top:2px}
.todo .tx{font-size:17px;font-weight:700}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.links a,.src a{word-break:break-all}
.src{margin-top:8px;font-size:13px;color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr;gap:8px}
.side{background:var(--soft);border-radius:12px;padding:10px 12px}
.side.us{background:#F8E7E4}
.side .who{font-family:var(--sans);font-size:13px;font-weight:750;letter-spacing:.04em;color:var(--wine);margin-bottom:4px}
.def{padding:8px 0;border-bottom:1px solid var(--line)}
.def:last-child{border-bottom:0}
.def b{display:block;font-size:16px}
.honor{display:flex;gap:10px;align-items:baseline;padding:8px 0;font-size:17px}
.honor i{font-family:var(--latin);font-style:normal;color:var(--wine);min-width:1.4em}
.st{display:inline-block;border-radius:999px;padding:3px 8px;font-size:13px;font-weight:750}
.st.warning{background:#F8D9D4;color:#8E2418}
.st.success{background:#E5F0E2;color:var(--basil)}
.loading{color:var(--muted)}
main > * + *{margin-top:12px}
.box.done{background:var(--basil);border-color:var(--basil)}
details.foot{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
details.foot summary{cursor:pointer;font-weight:750}
details.foot p{font-size:14px;color:var(--muted);line-height:1.7;margin:8px 0 0}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(min-width:800px){
  .top{padding:calc(12px + env(safe-area-inset-top)) 28px 12px}
  .top-row{gap:18px}
  .tabs{background:rgba(246,236,210,.08);padding:4px;border-radius:999px}
  .sub,.main,main{padding-left:28px;padding-right:28px}
  .grid.two{grid-template-columns:1fr 1fr}
  .span2{grid-column:1 / -1}
  .pair{grid-template-columns:1fr 1fr}
  .brand img{width:40px;height:40px}
}
@media(max-width:1100px){
  .top-row{flex-wrap:wrap}
  .tabs{order:3;width:100%;margin-top:8px;flex-wrap:wrap;overflow:visible;row-gap:6px}
}
@media(max-width:759px){
  .upd{margin-left:0;width:100%;text-align:left}
  .mast .brandname{font-size:38px}
  .sub .ttl{font-size:26px}
  .tab{padding:8px 11px}
}
@media(prefers-reduced-motion:reduce){
  .ticker span{animation:none}
  .hbar i,.go .hbar i{transition:none;width:var(--w)}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand">
      <img src="icons/logo-mark.png" alt="">
      <div><div class="word">PUCIBO</div><span class="subname">作战台</span></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="板块"></nav>
    <div class="right">
      <div class="clock"><div class="t"><span id="clk">--:--:--</span><small>东京</small></div><div class="s" id="clk2">济南 --:--</div></div>
      <button class="icon-btn" id="refresh" type="button">刷新</button>
      <button class="icon-btn dark" id="install" type="button" style="display:none">安装</button>
    </div>
  </div>
</header>
<div class="err" id="err" role="alert"></div>
<div class="hint" id="hint"></div>
<div class="sub" id="sub"></div>
<main id="main"><p class="loading">正在读取 data.json…</p></main>
<noscript><p style="padding:16px">请打开 JavaScript。本页的数字全部从 data.json 读取。</p></noscript>
<script>
(function(){
'use strict';
var D=null,S={tab:'kpi',period:'today'};
var TABS=[['kpi','指标'],['channel','渠道'],['dish','菜品'],['deal','团购'],['ledger','日账'],['social','口碑'],['rival','竞品'],['play','打法'],['source','接入']];
var TITLES={kpi:'经营指标',channel:'渠道与抽佣',dish:'菜品与毛利',deal:'抖音团购',ledger:'进货与日账',social:'社媒与口碑',rival:'爱意竞品',play:'三层打法',source:'数据接入'};
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ext(url,text){
  if(!url) return esc(text||'');
  var u=String(url);
  if(!/^https?:\/\//i.test(u)) return esc(text||u);
  return '<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(text||u)+'</a>';
}
function cell(v){
  if(v==null||v==='') return '<span class="miss">待接入</span>';
  var s=String(v);
  if(s==='待接入') return '<span class="miss">待接入</span>';
  if(s==='待定'||s==='待确认') return '<span class="nc">'+esc(s)+'</span>';
  if(s.indexOf('计划中')>=0&&s.length<=36) return '<span class="plan">'+esc(s)+'</span>';
  var numeric=/^[¥￥≥≤\d]/.test(s)&&s.length<=18;
  var html=esc(s).replace(/待接入/g,'<span class="miss">待接入</span>').replace(/待确认/g,'<span class="nc">待确认</span>');
  return '<span class="'+(numeric?'num':'')+'">'+html+'</span>';
}
function card(index,title,tag,body){
  return '<section class="card"><div class="ch"><h3>'+(index?'<span class="ic">'+esc(index)+'</span>':'')+esc(title)+'</h3>'+(tag?'<span class="tag">'+esc(tag)+'</span>':'')+'</div>'+body+'</section>';
}
function bars(block){
  var items=block.items||[],max=0,i;
  for(i=0;i<items.length;i++) if(items[i].value>max) max=items[i].value;
  return '<div class="bars">'+items.map(function(x,n){
    var p=max?Math.max(0,Math.min(100,x.value/max*100)):0;
    return '<div class="bar-row'+(n===block.emphasis?' em':'')+'"><div class="bar-l">'+esc(x.label)+'</div><div class="bar-v">'+esc(x.display)+'</div><div class="hbar"><i style="--w:'+p+'%"></i></div></div>';
  }).join('')+'</div>'+(block.note?'<p class="note">'+esc(block.note)+'</p>':'');
}
function links(list){
  if(!list||!list.length) return '';
  return '<div class="links">'+list.map(function(a){return ext(a.url,a.label)}).join('')+'</div>';
}
function srcLine(row){
  var bits=[];
  if(row.scraped_at) bits.push(esc(row.scraped_at));
  if(row.url) bits.push(ext(row.url,row.source_label||row.url));
  else if(row.source_label) bits.push(esc(row.source_label));
  if(row.url2) bits.push(ext(row.url2,row.url2_label||row.url2));
  return bits.length?'<div class="src">来源 '+bits.join(' · ')+'</div>':'';
}
function foot(){return '<details class="foot"><summary>口径</summary><p>'+esc(D.footer)+'</p><p>'+esc(D.how_to_update)+'</p></details>'}

function vKpi(){
  var s=D.shop,k=D.kpis,keys=['today','week','month'];
  var mast='<section class="card mast"><div class="en">'+esc(s.line)+'</div><div class="brandname">'+esc(s.name)+'</div><div class="slogan">'+esc(s.slogan)+'</div><div class="where">'+esc(s.city+s.place+' · '+s.unit)+'</div><p class="note" style="margin:8px 0 0">'+esc(s.meaning)+' · '+esc(s.kind)+'</p></section>';
  var call='<div class="callout"><b>框架，不是报表。</b> '+esc(D.framework)+'</div>';
  var rows=k.rows.map(function(r,i){
    var tiles='<div class="p3">'+keys.map(function(key,n){
      return '<div class="tile'+(S.period===key?' on':'')+'"><div class="l">'+esc(k.periods[n])+'</div><div class="v">'+cell(r[key])+'</div></div>';
    }).join('')+'</div>';
    return card(String(i+1).padStart(2,'0'), r.name, null, tiles+'<div class="kv"><span class="l">目标</span><span class="v">'+cell(r.target)+'</span></div><div class="kv"><span class="l">数据源</span><span class="v">'+esc(r.source)+'</span></div>');
  }).join('');
  var path=card('', k.path.title, '简报', bars(k.path));
  var defs=card('', '指标口径', null, k.definitions.map(function(d){return '<div class="def"><b>'+esc(d.title)+'</b><div class="note">'+esc(d.detail)+'</div></div>'}).join(''));
  return mast+call+'<div class="grid two">'+rows+path+defs+'</div>';
}
function vChannel(){
  var c=D.channels;
  var rows=c.rows.map(function(r,i){
    return card(String(i+1).padStart(2,'0'), r.name, null,
      '<div class="kv"><span class="l">收入口径</span><span class="v">'+esc(r.income)+'</span></div>'+
      '<div class="kv"><span class="l">抽佣 / 手续费</span><span class="v">'+cell(r.fee)+'</span></div>'+
      '<div class="kv"><span class="l">本月占比</span><span class="v">'+cell(r.share)+'</span></div>'+
      '<div class="kv"><span class="l">数据源</span><span class="v">'+esc(r.source)+'</span></div>');
  }).join('');
  return '<p class="note" style="margin-top:0">'+esc(c.note)+'</p><div class="grid two">'+rows+'</div>';
}
function vDish(){
  var rows=D.dishes.rows.map(function(r,i){
    var head=r.sale?('<div style="margin-bottom:8px">'+cell(r.sale)+'</div>'):'';
    return card(String(i+1).padStart(2,'0'), r.name, null,
      '<div class="note" style="margin:-4px 0 8px">'+esc(r.role)+'</div>'+head+
      '<div class="kv"><span class="l">外卖价（美团）</span><span class="v">'+cell(r.takeout)+'</span></div>'+
      '<div class="kv"><span class="l">堂食价</span><span class="v">'+cell(r.dine)+'</span></div>'+
      '<div class="kv"><span class="l">每份成本</span><span class="v">'+cell(r.cost)+'</span></div>'+
      '<div class="kv"><span class="l">单品毛利</span><span class="v">'+cell(r.margin)+'</span></div>'+
      '<div class="kv"><span class="l">本月份数</span><span class="v">'+cell(r.count)+'</span></div>'+
      (r.note?'<p class="note">'+esc(r.note)+'</p>':''));
  }).join('');
  return '<p class="note" style="margin-top:0">'+esc(D.dishes.note)+'</p><div class="grid">'+rows+'</div>';
}
function vDeal(){
  var d=D.deals;
  var th='<div class="p3">'+d.thresholds.map(function(t){
    return '<div class="tile"><div class="l">'+esc(t.label)+'</div><div class="v num">'+esc(t.value)+'</div></div>';
  }).join('')+'</div>';
  var funnel='<div class="funnel">'+d.funnel.steps.map(function(s,i){
    return '<div class="step"><b><span class="arrow">'+(i+1)+'</span>'+esc(s.name)+'</b><span>'+cell(s.value)+'</span></div>';
  }).join('')+'</div>';
  var rows=d.rows.map(function(r){
    var body=d.fields.map(function(f){
      return '<div class="kv"><span class="l">'+esc(f.label)+'</span><span class="v">'+cell(r[f.key])+'</span></div>';
    }).join('');
    return card('', r.name, r.who, body);
  }).join('');
  return '<p class="note" style="margin-top:0">'+esc(d.intro)+'</p><div class="grid">'+
    card('', 'ROI 门槛（简报）', null, th)+
    card('', d.funnel.title, null, funnel)+
    rows+'</div>';
}
function vLedger(){
  var rows=D.ledger.rows.map(function(r,i){
    return card(String(i+1).padStart(2,'0'), r.field, null,
      '<div class="kv"><span class="l">用途</span><span class="v">'+esc(r.use)+'</span></div>'+
      '<div class="kv"><span class="l">状态</span><span class="v">'+cell(r.status)+'</span></div>');
  }).join('');
  return '<p class="note" style="margin-top:0">'+esc(D.ledger.note)+'</p><div class="grid">'+rows+'</div>';
}
function vSocial(){
  var s=D.social;
  var rows=s.rows.map(function(r){
    var val=r.kind==='figure'?'<div class="tile"><div class="v">'+esc(r.value)+'</div></div>':'<p style="margin:0">'+cell(r.value)+'</p>';
    return card('', r.name, null, '<div class="note">看什么：'+esc(r.watch)+'</div>'+val+srcLine(r));
  }).join('');
  var place=s.place;
  var facts=place.items.map(function(it){
    return '<div class="def"><b>'+esc(it.label)+'</b><div>'+esc(it.value)+'</div></div>';
  }).join('');
  var quotes=s.quotes.map(function(q){
    return '<blockquote class="quote"><p>'+esc(q.text)+'</p><cite>'+ext(q.url,q.cite)+'</cite></blockquote>';
  }).join('');
  var honors=s.honors.map(function(h,i){return '<div class="honor"><i>'+(i+1)+'</i><span>'+esc(h)+'</span></div>'}).join('');
  var conf=s.conflicts.map(function(c){return '<div class="def"><b>'+esc(c.title)+'</b><div class="note">'+esc(c.detail)+'</div></div>'}).join('');
  return '<p class="note" style="margin-top:0">'+esc(s.intro)+'</p><div class="grid">'+rows+
    card('', place.title, null, facts+'<p class="note">'+esc(place.hours_conflict)+'</p>'+links(place.links))+
    card('', s.quotes_title, null, quotes+'<p class="note">'+esc(s.review_note)+'</p>')+
    card('', s.honors_title, '品牌手册', honors+'<p class="note">'+esc(s.honors_note)+'</p>')+
    card('', s.conflicts_title, null, conf)+
  '</div>';
}
function vRival(){
  var r=D.rival;
  var rows=r.rows.map(function(row){
    return card('', row.item, null, '<div class="pair"><div class="side us"><div class="who">'+esc(r.us)+'</div><div>'+cell(row.us)+'</div></div><div class="side"><div class="who">'+esc(r.them)+'</div><div>'+cell(row.them)+'</div></div></div>');
  }).join('');
  var extra=r.extra.map(function(it){return '<div class="def"><b>'+esc(it.label)+'</b><div>'+esc(it.value)+'</div></div>'}).join('');
  var notes=r.notes.map(function(n){
    return '<div class="def"><b>'+esc(n.title)+'</b><div>'+esc(n.detail)+(n.url?' '+ext(n.url,'来源'):'')+'</div></div>';
  }).join('');
  return '<div class="grid">'+rows+
    card('', r.bars.title, '简报', bars(r.bars))+
    card('', r.extra_title, null, extra+notes+links(r.links)+'<p class="note">'+esc(r.boundary)+'</p>')+
  '</div>';
}
function vPlay(){
  var p=D.plays;
  var rows=p.rows.map(function(r){
    return card('', r.layer, null,
      '<div class="kv"><span class="l">抓手</span><span class="v">'+esc(r.lever)+'</span></div>'+
      '<div class="kv"><span class="l">目标客群</span><span class="v">'+esc(r.who)+'</span></div>'+
      '<div class="kv"><span class="l">作用</span><span class="v">'+esc(r.effect)+'</span></div>'+
      (r.sale?'<div class="kv"><span class="l">上线</span><span class="v">'+cell(r.sale)+'</span></div>':'')+
      '<div class="kv"><span class="l">进度</span><span class="v">'+cell(r.progress)+'</span></div>');
  }).join('');
  var todos=p.todos.map(function(t,i){
    return '<div class="todo"><span class="box'+(t.done?' done':'')+'" aria-hidden="true"></span><div><div class="tx">'+esc(t.text)+'</div>'+(t.meta?'<div class="note">'+esc(t.meta)+'</div>':'')+'</div></div>';
  }).join('');
  return '<div class="grid">'+rows+card('', p.todos_title, null, todos)+'</div>';
}
function vSource(){
  var s=D.sources;
  var rows=s.rows.map(function(r){
    return card('', r.name, null,
      '<div class="kv"><span class="l">喂哪个板块</span><span class="v">'+esc(r.feeds)+'</span></div>'+
      '<div class="kv"><span class="l">需要老车提供</span><span class="v">'+esc(r.need)+'</span></div>'+
      '<div class="kv"><span class="l">状态</span><span class="v"><span class="st '+esc(r.tone)+'">'+esc(r.status)+'</span></span></div>');
  }).join('');
  var asks=s.asks.map(function(a,i){return '<div class="honor"><i>'+(i+1)+'</i><span>'+esc(a)+'</span></div>'}).join('');
  return '<div class="grid">'+rows+
    card('', s.asks_title, null, asks)+
    '<div class="callout">'+esc(s.password_note)+'</div></div>';
}

function seg(){
  return '<div class="seg" role="group" aria-label="时段">'+[['today','今日'],['week','本周'],['month','本月']].map(function(p){
    return '<button type="button" data-p="'+p[0]+'" class="'+(S.period===p[0]?'on':'')+'">'+p[1]+'</button>';
  }).join('')+'</div>';
}
function render(anim){
  if(!D) return;
  $('tabs').innerHTML=TABS.map(function(t){
    var on=S.tab===t[0];
    return '<button type="button" class="tab'+(on?' on':'')+'" data-t="'+t[0]+'" aria-current="'+(on?'page':'false')+'">'+t[1]+'</button>';
  }).join('');
  $('sub').innerHTML='<div class="ttl">'+esc(TITLES[S.tab])+'</div><span class="pill">'+esc(D.status)+'</span>'+
    (S.tab==='kpi'?seg():'')+
    '<div class="upd">数据 '+esc(D.updated_label)+'<br>'+esc(D.updated_sub)+'</div>'+
    '<div class="ticker"><span id="tick-inner"></span></div>';
  var html=S.tab==='kpi'?vKpi():S.tab==='channel'?vChannel():S.tab==='dish'?vDish():S.tab==='deal'?vDeal():S.tab==='ledger'?vLedger():S.tab==='social'?vSocial():S.tab==='rival'?vRival():S.tab==='play'?vPlay():vSource();
  $('main').innerHTML=html+foot();
  var tick=$('tick-inner');
  if(tick) tick.innerHTML=S.tab==='kpi'
    ? (D.alerts||[]).map(function(a){return '<div>'+esc(a)+'</div>'}).join('')
    : esc(D.header_note||'');
  document.body.classList.remove('go');
  if(anim===false) document.body.classList.add('go');
  else requestAnimationFrame(function(){document.body.classList.add('go')});
}
document.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.t){S.tab=b.dataset.t;try{history.replaceState(null,'','#'+S.tab)}catch(_){}render();window.scrollTo(0,0)}
  else if(b.dataset.p){S.period=b.dataset.p;render(false)}
});
function clock(){
  var now=new Date();
  var f=function(tz,sec){return new Intl.DateTimeFormat('zh-CN',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:sec?'2-digit':undefined,hour12:false}).format(now)};
  $('clk').textContent=f('Asia/Tokyo',1);
  $('clk2').textContent='济南 '+f('Asia/Shanghai',0);
}
function load(force){
  return fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok) throw new Error('HTTP '+r.status);return r.json()}).then(function(j){
    var changed=!D||D.updated_at!==j.updated_at;D=j;$('err').style.display='none';
    if(changed||force) render();
  }).catch(function(e){
    $('err').style.display='block';
    $('err').textContent='data.json 读取失败（'+e.message+'）'+(D?'，屏幕上仍是上次的数字。':'。请检查网络后点「刷新」。');
  });
}
var h0=(location.hash||'').slice(1);
if(TABS.some(function(x){return x[0]===h0})) S.tab=h0;
$('refresh').onclick=function(){load(true)};
clock();setInterval(clock,1000);load();setInterval(function(){load(false)},5*60*1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden) load(false)});
var deferred=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;$('install').style.display=''});
$('install').onclick=function(){if(deferred){deferred.prompt();deferred=null;$('install').style.display='none'}};
var ua=navigator.userAgent,standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(!standalone){
  if(/MicroMessenger/i.test(ua)){$('hint').style.display='block';$('hint').textContent='在微信里可以直接看。想放到桌面：点右上角「…」→「在浏览器打开」，再用浏览器的「添加到主屏幕」。'}
  else if(/iPhone|iPad|iPod/i.test(ua)){$('hint').style.display='block';$('hint').textContent='放到主屏幕：Safari 底部「分享」→「添加到主屏幕」。'}
}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
</body>
</html>
